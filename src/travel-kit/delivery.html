<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HORIZONS · تسليم حزمة السفر</title><link rel="stylesheet" href="admin.css"><script defer src="travel-delivery.js"></script></head><body><header><a href="./">لوحة الإدارة</a></header><main><section class="panel"><h1>تسليم حزمة السفر</h1><p>سجّل دخولك في لوحة الإدارة، ثم أدخل مرجع الطلب وبريد العميل كما وصلا في إشعار الطلب.</p><form id="delivery-form"><div class="fields"><label>مرجع الطلب<input name="reference" required dir="ltr" pattern="HZN-M-[0-9]{8}-[A-F0-9]{16}"></label><label>بريد العميل<input name="email" type="email" required dir="ltr"></label><label>مرجع الحوالة أو إيصال الدفع<input name="receipt" required minlength="3" maxlength="100" dir="ltr"></label></div><label class="check"><input name="confirmed" type="checkbox" required><span>تحققت بنفسي من وصول مبلغ الطلب كاملًا إلى حساب الشركة.</span></label><button>إنشاء رابط التسليم</button></form><p role="status" id="status"></p><div id="result" hidden><p>انسخ هذا الرابط وأرسله أنت إلى العميل عبر البريد. لم تُرسل أي رسالة تسليم تلقائيًا.</p><input id="delivery-link" readonly dir="ltr" aria-label="رابط التسليم"><p>صالح لسبعة أيام ولغاية خمس عمليات تحميل. إصدار رابط جديد يلغي الرابط السابق لهذا الطلب.</p></div></section></main></body></html>
