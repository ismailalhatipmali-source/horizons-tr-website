name: Section 05 source review
on:
  push:
    branches: ['work/blending4-20261004']
    paths: ['.github/workflows/blending4-source-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare code-only source snapshot
        shell: python
        run: |
          import pathlib, shutil, subprocess, json
          target=pathlib.Path('/tmp/horizons-review')
          selected=[]
          for name in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              p=pathlib.Path(name)
              if p.parts[0] not in ['src','scripts','release-assets','docs','tests'] and name not in ['.cpanel.yml','.gitignore','README.md']:
                  continue
              if p.suffix.lower() not in ['.js','.mjs','.cjs','.json','.php','.py','.css','.html','.md','.yml','.txt'] and name!='.gitignore':
                  continue
              if p.stat().st_size>10_000_000:
                  continue
              dest=target/p
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,dest)
              selected.append({'path':name,'bytes':p.stat().st_size})
          (target/'REVIEW_FILES.json').write_text(json.dumps(selected,indent=2))
          (target/'REVIEW_COMMIT.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - uses: actions/upload-artifact@v4
        with:
          name: horizons-section05-code-review
          path: /tmp/horizons-review/
          include-hidden-files: true
          retention-days: 2
