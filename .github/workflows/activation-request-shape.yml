name: Activation JSON request regression
on:
  push:
    branches: [main, 'fix/membership-empty-json-*']
    paths: ['src/activation/public-index.php', 'tests/test_activation_request_shape.py', '.github/workflows/activation-request-shape.yml']
  pull_request:
    paths: ['src/activation/public-index.php', 'tests/test_activation_request_shape.py', '.github/workflows/activation-request-shape.yml']
permissions:
  contents: read
jobs:
  request-shape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            src/activation/public-index.php
            tests/test_activation_request_shape.py
          sparse-checkout-cone-mode: false
      - name: Install PHP fixture runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli
      - name: Syntax and HTTP request regression
        run: |
          php -l src/activation/public-index.php
          python3 -m unittest discover -s tests -p test_activation_request_shape.py -v
